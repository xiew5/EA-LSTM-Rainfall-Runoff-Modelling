# --- Experiment configurations --------------------------------------------------------------------

# https://stefanbauer.me/articles/how-to-keep-your-git-fork-up-to-date#:~:text=Merge%20the%20upstream%20with%20your,can%20just%20merge%20the%20changes.&text=With%20that%2C%20you%20merge%20the,and%20merging%20in%20one%20step.



# experiment name, used as folder name

experiment_name: experimentNSE30tun0hs128



# place to store run directory (if empty runs are stored in code_dir/runs/)

#run_dir: /dbfs/mnt/lab/unrestricted/larissa.vickers@environment-agency.gov.uk/camels-gb/runs

run_dir: ./runs



# files to specify training, validation and test basins (relative to code root or absolute path)

# train_basin_file: ./basins/basin_list.txt

# validation_basin_file: ./basins/basin_list.txt

# test_basin_file: ./basins/test_list.txt

train_basin_file: ./basins/train_list.txt
validation_basin_file: ./basins/validation_list.txt
test_basin_file: ./basins/test_list.txt

# training, validation and test time periods (format = 'dd/mm/yyyy')

# train_start_date: '01/10/1990'

# train_end_date: '30/09/2015'

# validation_start_date: '01/10/2015'

# validation_end_date: '31/12/2017'

# test_start_date: '01/01/2018'

# test_end_date: '31/12/2020'

train_start_date: '01/10/1990'
train_end_date: '31/12/2020'

validation_start_date: '01/10/1990'
validation_end_date: '31/12/2020'

test_start_date: '01/10/1990'
test_end_date: '31/12/2020'



# which GPU (id) to use [in format of cuda:0, cuda:1 etc, or cpu or None]

device: mps



# fixed seed, leave empty to use a random seed

seed: 1



# --- Validation configuration ---------------------------------------------------------------------



# specify after how many epochs to perform validation

validate_every: 5



# specify how many random basins to use for validation

# Use all basins from validation_basin_file for stable national validation.
# validate_n_random_basins: 1



# specify which metrics to calculate during validation (see neuralhydrology.evaluation.metrics)

# this can either be a list or a dictionary. If a dictionary is used, the inner keys must match the name of the

# target_variable specified below. Using dicts allows for different metrics per target variable.

metrics:

- NSE

- KGE



# --- Model configuration --------------------------------------------------------------------------



# base model type [cudalstm, customlstm, ealstm, embcudalstm, mtslstm, gru, transformer]

# (has to match the if statement in modelzoo/__init__.py)

model: ealstm



# prediction head [regression]. Define the head specific parameters below

head: regression



# ----> Regression settings <----

output_activation: linear



# ----> General settings <----



# Number of cell states of the LSTM

hidden_size: 128



# Initial bias value of the forget gate

initial_forget_bias: 3



# Dropout applied to the output of the LSTM

output_dropout: 0.4



# ----> Embedding network settings <----



# define embedding network for static inputs

statics_embedding:

  type: fc

  # define number of neurons per layer in the FC network used as embedding network

  hiddens:

    - 30

    - 20

    - 64

  # activation function of embedding network

  activation: tanh

  # dropout applied to embedding network

  dropout: 0.0



# define embedding network for dynamic inputs

dynamics_embedding:

  type: fc

  # define number of neurons per layer in the FC network used as embedding network

  hiddens:

    - 30

    - 20

    - 64

  # activation function of embedding network

  activation: tanh

  # dropout applied to embedding network

  dropout: 0.0



# ----> MTSLSTM settings <----



# use an individual LSTM per frequencies (False) vs. use a single shared LSTM for all frequencies (True)

shared_mtslstm: False



# how to transfer states from lower to higher frequencies. One of [identity, linear, None].

transfer_mtslstm_states:

    h: identity

    c: identity



# ----> ODE-LSTM settings <----

# method to use to solve the ODE. One of [euler, rk4, heun]

ode_method: euler



# number of iterations to break each ODE solving step into.

ode_num_unfolds: 4



# lowest frequency that will be used to randomly aggregate the first slice of the input sequence.

# See ODELSTM for more details on the frequency randomization.

ode_random_freq_lower_bound: 6D



# ----> Transformer settings <----



# number of layers in transformer encoding:

transformer_nlayers: 4



# type of positional encoding (sum or concatenate)

transformer_positional_encoding_type: sum



# dimension of feedforward in each encoding layer

transformer_dim_feedforward: 32



# dropout applied only to the positional encoding

transformer_positional_dropout: 0.0



# dropout used in the encoding layers

transformer_dropout: 0



# number of transformer heads

transformer_nheads: 4



# --- Training configuration -----------------------------------------------------------------------



# specify optimizer [Adam]

optimizer: Adam



# specify loss [MSE, MAE, NSE, RMSE]

loss: NSE



# specify learning rates to use starting at specific epochs (0 is the initial learning rate)

learning_rate:

    # 0: 7e-4

    # 15: 3e-4

    # 30: 1e-4

    0: 1e-3

    10: 5e-4

    20: 1e-4



# Mini-batch size

batch_size: 256



# Number of training epochs

epochs: 30



# If a value, clips the gradients during training to that norm.

clip_gradient_norm: 1



# Defines which time steps are used to calculate the loss. Can't be larger than seq_length.

# If use_frequencies is used, this needs to be a dict mapping each frequency to a predict_last_n-value, else an int.

predict_last_n: 1



# Length of the input sequence

# If use_frequencies is used, this needs to be a dict mapping each frequency to a seq_length, else an int.

seq_length: 365



# Number of parallel workers used in the data pipeline

num_workers: 8



# Log the training loss every n steps

log_interval: 10



# If true, writes logging results into tensorboard file

log_tensorboard: True



# If a value and greater than 0, logs n random basins as figures during validation

log_n_figures: 1



# Save model weights every n epochs

save_weights_every: 1



# --- Data configurations --------------------------------------------------------------------------



# which data set to use [camels_us, camels_gb, global, hourly_camels_us]

dataset: camels_gb



# Path to data set root

data_dir: ./NATIONAL_input



# Path to pre-processed hdf5 file here (and corresponding scaler pickle file). Leave empty to create

# new hdf5 file

#h5_file:

#scaler_file:



# whether to load the entire data into memory or not

cache_validation_data: True



# Forcing product [daymet, maurer, maurer_extended, nldas, nldas_extended, nldas_hourly]

# can be either a list of forcings or a single forcing product

# forcings: maurer_extended



# which columns to use as target

